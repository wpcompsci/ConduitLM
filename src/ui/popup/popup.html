<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ConduitLM</h1>
      </header>

      <!-- Access Gate -->
      <div id="gate-view" class="view hidden">
        <p>Access to NotebookLM is required to send selections.</p>
        <button id="btn-enable-access" class="primary">Enable Access</button>
      </div>

      <!-- Main Form -->
      <div id="form-view" class="view hidden">
        <div class="field-group">
          <label for="intent-select">Content</label>
          <select id="intent-select">
            <option value="auto" selected>Auto-detect (recommended)</option>
            <option value="selection">Selected text</option>
            <option value="page">Full web page</option>
            <option value="chat">ChatGPT or Gemini conversation</option>
            <option value="gdoc">Google Doc</option>
          </select>
        </div>

        <div class="field-group">
          <label for="notebook-select">Destination</label>
          <select id="notebook-select">
            <option value="" disabled selected>Loading notebooks...</option>
          </select>
        </div>

        <div id="create-container" class="field-group hidden">
          <label for="new-notebook-title">New Notebook Name</label>
          <input type="text" id="new-notebook-title" placeholder="My Research" />
        </div>

        <div class="actions">
          <button id="btn-confirm-send" class="primary" disabled>Confirm Send</button>
        </div>
      </div>

      <!-- Status/Feedback -->
      <div id="status-view" class="view hidden">
        <div id="status-icon"></div>
        <div id="status-message"></div>
        <div id="status-detail"></div>
        <details id="status-detail-box" class="hidden">
          <summary>Details</summary>
          <pre id="status-detail-text"></pre>
        </details>
        <button id="btn-reset" class="secondary hidden">Back</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Access Gate -->
      <div id="gate-view" class="view hidden conduitlm-panel">
        <div class="conduitlm-title">ConduitLM</div>
        <div class="conduitlm-text">Access to NotebookLM is required to send content.</div>
        <div class="conduitlm-actions">
          <button id="btn-enable-access" class="conduitlm-confirm">Enable Access</button>
        </div>
      </div>

      <!-- Site Access Gate -->
      <div id="site-gate-view" class="view hidden conduitlm-panel">
        <div class="conduitlm-title">ConduitLM</div>
        <div class="conduitlm-text">Access to this site is required to continue.</div>
        <div id="site-domain" class="site-domain"></div>
        <div class="conduitlm-actions">
          <button id="btn-enable-site" class="conduitlm-confirm">Enable on this site</button>
          <button id="btn-cancel-send" class="conduitlm-secondary">Cancel send</button>
        </div>
      </div>

      <!-- Main Form -->
      <div id="form-view" class="view hidden conduitlm-panel">
        <div class="conduitlm-title">ConduitLM</div>

        <div class="conduitlm-label">Intent</div>
        <div class="conduitlm-intents">
          <button id="intent-selection" class="conduitlm-option" type="button">
            Send Selection
          </button>
          <button id="intent-source" class="conduitlm-option" type="button">
            Send Source Extract
          </button>
          <button id="intent-page" class="conduitlm-option" type="button">
            Send Page Main Content
          </button>
        </div>

        <div class="conduitlm-field">
          <div class="conduitlm-label">Destination</div>
          <select id="notebook-select" class="conduitlm-select">
            <option value="" disabled selected>Loading notebooks...</option>
          </select>

          <input
            type="text"
            id="new-notebook-title"
            class="conduitlm-input hidden"
            placeholder="New notebook name"
          />
        </div>

        <div class="conduitlm-actions">
          <button id="btn-confirm-send" class="conduitlm-confirm" disabled>
            Confirm Send
          </button>
        </div>
      </div>

      <!-- Status/Feedback -->
      <div id="status-view" class="view hidden conduitlm-panel">
        <div class="conduitlm-title">ConduitLM</div>
        <div id="status-icon"></div>
        <div id="status-message"></div>
        <div id="status-detail"></div>
        <details id="status-detail-box" class="hidden">
          <summary>Details</summary>
          <pre id="status-detail-text"></pre>
        </details>
        <div class="conduitlm-actions">
          <button id="btn-reset" class="conduitlm-secondary hidden">Back</button>
        </div>
      </div>
    </div>
    <script src="../../shared/hosts.js"></script>
    <script src="../../shared/triggers.js"></script>
    <script src="../../shared/trigger_store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
